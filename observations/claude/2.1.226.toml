[[store]]
id = "claude.history"
path_pattern = "${CLAUDE_CONFIG_DIR or ${HOME}/.claude}/history.jsonl"
role = "prompt_history"
format = "jsonl"
has_discovery = true
source_count = 1
discovers_as = [
    "claude.history",
]
records_sampled = 400

[store.record_keys]
"*" = [
    "display",
    "pastedContents",
    "project",
