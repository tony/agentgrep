[agent]
id = "claude"
app_version = "2.1.226"
version_source = "cli"

[observation]
observed_at = 2026-08-08
platform = "linux"
catalog_version = 37
generator = "scripts/observe_stores.py"

[[store]]
id = "claude.global_config"
path_pattern = "${HOME}/.claude.json"
role = "app_state"
format = "json_object"
has_discovery = false
source_count = 0

[[store]]
id = "claude.projects.subagent_meta"
path_pattern = "${CLAUDE_CONFIG_DIR or ${HOME}/.claude}/projects/<encoded_project>/<session_uuid>/subagents/<agent>.meta.json"
role = "app_state"
format = "json_object"
has_discovery = false
source_count = 0

[[store]]
id = "claude.worktrees"
path_pattern = "<project_root>/.claude/worktrees/<name>"
