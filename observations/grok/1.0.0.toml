[agent]
id = "grok"
app_version = "1.0.0"
version_source = "cli"

[observation]
observed_at = 2026-08-08
platform = "linux"
catalog_version = 37
generator = "scripts/observe_stores.py"

[[store]]
id = "grok.prompt_history"
path_pattern = "${GROK_HOME or ${HOME}/.grok}/sessions/<url_encoded_project>/prompt_history.jsonl"
role = "prompt_history"
format = "jsonl"
has_discovery = true
source_count = 7
discovers_as = [
    "grok.prompt_history",
]
records_sampled = 55

[store.record_keys]
"*" = [
    "is_bash",
    "prompt",
    "session_id",
    "timestamp",
]

[[store]]
id = "grok.sessions"
path_pattern = "${GROK_HOME or ${HOME}/.grok}/sessions/<url_encoded_project>/<session_uuid>/chat_history.jsonl"
role = "primary_chat"
format = "jsonl"
has_discovery = true
source_count = 19
discovers_as = [
    "grok.sessions",
]
discriminator = "type"
records_sampled = 704

[store.record_keys]
assistant = [
    "content",
    "model_fingerprint",
    "model_id",
    "reasoning_effort",
    "tool_calls",
    "type",
]
reasoning = [
