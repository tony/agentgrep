[agent]
id = "cursor-cli"
app_version = "2026.08.04-aaa8809"
version_source = "cli"

[observation]
observed_at = 2026-08-08
platform = "linux"
catalog_version = 35
generator = "scripts/observe_stores.py"

[[store]]
id = "cursor-cli.transcripts"
path_pattern = "${HOME}/.cursor/projects/<id>/agent-transcripts/<session_uuid>/<session_uuid>.jsonl"
role = "primary_chat"
format = "jsonl"
has_discovery = true
source_count = 319
discovers_as = [
    "cursor-cli.transcripts",
]
discriminator = "role"
records_sampled = 2713

[store.record_keys]
"*" = [
    "status",
    "type",
]
assistant = [
    "message",
    "role",
]
user = [
    "message",
    "role",
]

[[store]]
id = "cursor-cli.subagent_transcripts"
path_pattern = "${HOME}/.cursor/projects/<id>/agent-transcripts/<session_uuid>/subagents/<agent>.jsonl"
