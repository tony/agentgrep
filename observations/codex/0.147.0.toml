manifest_version = 1
unclaimed = []

[agent]
id = "codex"
app_version = "0.147.0"
version_source = "cli"

[observation]
observed_at = 2026-08-08
platform = "linux"
catalog_version = 35
generator = "scripts/observe_stores.py"

[[store]]
id = "codex.history"
path_pattern = "${CODEX_HOME or ${HOME}/.codex}/history.jsonl"
role = "prompt_history"
format = "jsonl"
has_discovery = true
source_count = 2
discovers_as = [
    "codex.history",
]
records_sampled = 418

[store.record_keys]
"*" = [
    "command",
    "session_id",
    "text",
    "timestamp",
    "ts",
]

[[store]]
id = "codex.sessions"
path_pattern = "${CODEX_HOME or ${HOME}/.codex}/sessions/YYYY/MM/DD/rollout-YYYY-MM-DDThh-mm-ss-<uuid>.jsonl"
role = "primary_chat"
format = "jsonl"
has_discovery = true
source_count = 6256
discovers_as = [
    "codex.sessions",
]
discriminator = "type"
records_sampled = 7891

[store.record_keys]
compacted = [
    "payload",
    "timestamp",
    "type",
]
