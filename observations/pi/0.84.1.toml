manifest_version = 1
unclaimed = [
    { path_pattern = "${HOME}/.pi/.ruff_cache", kind = "dir" },
    { path_pattern = "${HOME}/.pi/.ruff_cache/.gitignore", kind = "file" },
    { path_pattern = "${HOME}/.pi/.ruff_cache/0.15.22", kind = "dir" },
    { path_pattern = "${HOME}/.pi/.ruff_cache/CACHEDIR.TAG", kind = "file" },
    { path_pattern = "${HOME}/.pi/agent/AGENTS.md", kind = "file" },
    { path_pattern = "${HOME}/.pi/agent/extensions", kind = "dir" },
    { path_pattern = "${HOME}/.pi/agent/keybindings.json", kind = "file" },
    { path_pattern = "${HOME}/.pi/agent/models-store.json", kind = "file" },
    { path_pattern = "${HOME}/.pi/agent/run-history.jsonl", kind = "file" },
    { path_pattern = "${HOME}/.pi/agent/skills", kind = "dir" },
    { path_pattern = "${HOME}/.pi/agent/trust.json", kind = "file" },
]

[agent]
id = "pi"
app_version = "0.84.1"
version_source = "cli"

[observation]
observed_at = 2026-08-08
platform = "linux"
catalog_version = 35
generator = "scripts/observe_stores.py"

[[store]]
id = "pi.sessions"
path_pattern = "${PI_CODING_AGENT_DIR or ${HOME}/.pi/agent}/sessions/--<encoded_cwd>--/<ts>_<session_uuid>.jsonl"
role = "primary_chat"
format = "jsonl"
has_discovery = true
source_count = 42
discovers_as = [
    "pi.sessions",
]
discriminator = "type"
records_sampled = 2200

[store.record_keys]
custom = [
    "customType",
    "data",
    "id",
    "parentId",
    "timestamp",
    "type",
]
message = [
    "id",
    "message",
    "parentId",
    "timestamp",
    "type",
]
model_change = [
    "id",
    "modelId",
    "parentId",
    "provider",
    "timestamp",
    "type",
]
session = [
    "cwd",
    "id",
    "parentSession",
    "timestamp",
    "type",
    "version",
]
session_info = [
    "id",
    "name",
    "parentId",
    "timestamp",
    "type",
]
thinking_level_change = [
    "id",
    "parentId",
    "thinkingLevel",
    "timestamp",
    "type",
]

[[store]]
id = "pi.context_mode_db"
path_pattern = "${HOME}/.pi/context-mode/sessions/<project_hash>.db"
role = "app_state"
format = "sqlite"
has_discovery = true
source_count = 0
discovers_as = [
    "pi.context_mode_db",
]

[[store]]
id = "pi.settings"
path_pattern = "${PI_CODING_AGENT_DIR or ${HOME}/.pi/agent}/settings.json"
role = "app_state"
format = "json_object"
has_discovery = false
source_count = 0

[[store]]
id = "pi.auth"
path_pattern = "${PI_CODING_AGENT_DIR or ${HOME}/.pi/agent}/auth.json"
role = "app_state"
format = "json_object"
has_discovery = false
source_count = 0

[[store]]
id = "pi.models"
path_pattern = "${PI_CODING_AGENT_DIR or ${HOME}/.pi/agent}/models.json"
role = "app_state"
format = "json_object"
has_discovery = false
source_count = 0

[[store]]
id = "pi.themes"
path_pattern = "${PI_CODING_AGENT_DIR or ${HOME}/.pi/agent}/themes/<theme>.json"
role = "app_state"
format = "json_object"
has_discovery = false
source_count = 0

[[store]]
id = "pi.tools"
path_pattern = "${PI_CODING_AGENT_DIR or ${HOME}/.pi/agent}/tools/<tool>"
role = "app_state"
format = "opaque"
has_discovery = false
source_count = 0

[[store]]
id = "pi.bin"
path_pattern = "${PI_CODING_AGENT_DIR or ${HOME}/.pi/agent}/bin/<binary>"
role = "app_state"
format = "opaque"
has_discovery = false
source_count = 0

[[store]]
id = "pi.prompts"
path_pattern = "${PI_CODING_AGENT_DIR or ${HOME}/.pi/agent}/prompts/<prompt>.md"
role = "instruction"
format = "md_frontmatter"
has_discovery = false
source_count = 0

[[store]]
id = "pi.debug_log"
path_pattern = "${PI_CODING_AGENT_DIR or ${HOME}/.pi/agent}/pi-debug.log"
role = "app_state"
format = "text"
has_discovery = false
source_count = 0

[[store]]
id = "pi.extensions_npm"
path_pattern = "${PI_CODING_AGENT_DIR or ${HOME}/.pi/agent}/npm/"
role = "app_state"
format = "opaque"
has_discovery = false
source_count = 0
