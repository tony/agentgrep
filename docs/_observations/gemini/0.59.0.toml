manifest_version = 1
unclaimed = [
    { path_pattern = "${HOME}/.gemini/antigravity", kind = "dir" },
    { path_pattern = "${HOME}/.gemini/antigravity-cli", kind = "dir" },
    { path_pattern = "${HOME}/.gemini/config", kind = "dir" },
    { path_pattern = "${HOME}/.gemini/google_account_id", kind = "file" },
    { path_pattern = "${HOME}/.gemini/google_accounts.json", kind = "file" },
    { path_pattern = "${HOME}/.gemini/installation_id", kind = "file" },
    { path_pattern = "${HOME}/.gemini/oauth_creds.json", kind = "file" },
    { path_pattern = "${HOME}/.gemini/state.json", kind = "file" },
    { path_pattern = "${HOME}/.gemini/trustedFolders.json", kind = "file" },
    { path_pattern = "${HOME}/.gemini/user_id", kind = "file" },
]

[agent]
id = "gemini"
app_version = "0.59.0"
version_source = "cli"

[observation]
observed_at = 2026-09-11
platform = "linux"
catalog_version = 37
generator = "scripts/observe_stores.py"

[[store]]
id = "gemini.projects_registry"
path_pattern = "${GEMINI_CLI_HOME or ${HOME}/.gemini}/projects.json"
role = "app_state"
format = "json_object"
has_discovery = false
source_count = 0

[[store]]
id = "gemini.history"
path_pattern = "${GEMINI_CLI_HOME or ${HOME}/.gemini}/history/<project>/"
role = "source_tree"
format = "opaque"
has_discovery = false
source_count = 0

[[store]]
id = "gemini.worktrees"
path_pattern = "<project_root>/.gemini/worktrees/<name>"
role = "source_tree"
format = "opaque"
has_discovery = false
source_count = 0

[[store]]
id = "gemini.tmp.chats"
path_pattern = "${GEMINI_CLI_HOME or ${HOME}/.gemini}/tmp/<project_hash>/chats/session-<timestamp><id>.jsonl"
role = "primary_chat"
format = "jsonl"
has_discovery = true
source_count = 210
discovers_as = [
    "gemini.tmp_chats",
]
discriminator = "type"
records_sampled = 663

[store.record_keys]
"*" = [
    "$rewindTo",
    "$set",
    "kind",
    "lastUpdated",
    "projectHash",
    "sessionId",
    "startTime",
]
gemini = [
    "content",
    "id",
    "model",
    "thoughts",
    "timestamp",
    "tokens",
    "toolCalls",
    "type",
]
info = [
    "content",
    "id",
    "timestamp",
    "type",
]
user = [
    "content",
    "displayContent",
    "id",
    "timestamp",
    "type",
]

[[store]]
id = "gemini.tmp.checkpoints"
path_pattern = "${GEMINI_CLI_HOME or ${HOME}/.gemini}/tmp/<project_hash>/chats/checkpoint-<tag>.json"
role = "supplementary_chat"
format = "json_object"
has_discovery = false
source_count = 0

[[store]]
id = "gemini.tmp.logs"
path_pattern = "${GEMINI_CLI_HOME or ${HOME}/.gemini}/tmp/<project_hash>/logs.json"
role = "prompt_history"
format = "json_array"
has_discovery = true
source_count = 50
discovers_as = [
    "gemini.tmp_logs",
]
discriminator = "type"
records_sampled = 432

[store.record_keys]
user = [
    "message",
    "messageId",
    "sessionId",
    "timestamp",
    "type",
]

[[store]]
id = "gemini.tmp.chats_legacy"
path_pattern = "${GEMINI_CLI_HOME or ${HOME}/.gemini}/tmp/<project_hash>/chats/session-<timestamp><id>.json"
role = "supplementary_chat"
format = "json_object"
has_discovery = true
source_count = 998
discovers_as = [
    "gemini.tmp_chats_legacy",
]
discriminator = "kind"
records_sampled = 40

[store.record_keys]
main = [
    "kind",
    "lastUpdated",
    "messages",
    "projectHash",
    "sessionId",
    "startTime",
]

[[store]]
id = "gemini.skills"
path_pattern = "${GEMINI_CLI_HOME or ${HOME}/.gemini}/skills/"
role = "app_state"
format = "md_frontmatter"
has_discovery = false
source_count = 0

[[store]]
id = "gemini.settings"
path_pattern = "${GEMINI_CLI_HOME or ${HOME}/.gemini}/settings.json"
role = "app_state"
format = "json_object"
has_discovery = false
source_count = 0

[[store]]
id = "gemini.memory"
path_pattern = "${GEMINI_CLI_HOME or ${HOME}/.gemini}/GEMINI.md"
role = "persistent_memory"
format = "text"
has_discovery = true
source_count = 0
discovers_as = [
    "gemini.memory",
]

[[store]]
id = "gemini.tool_outputs"
path_pattern = "${GEMINI_CLI_HOME or ${HOME}/.gemini}/tmp/<project_hash>/tool-outputs/session-<id>/<name>.txt"
role = "app_state"
format = "text"
has_discovery = true
source_count = 0
discovers_as = [
    "gemini.tool_outputs",
]
