manifest_version = 1

[agent]
id = "cursor-ide"
app_version = "unknown"
version_source = "unknown"

[observation]
observed_at = 2026-09-11
platform = "linux"
catalog_version = 37
generator = "scripts/observe_stores.py"

[[store]]
id = "cursor-ide.state_vscdb"
path_pattern = "${HOME}/.config/Cursor/User/globalStorage/state.vscdb"
role = "primary_chat"
format = "sqlite"
has_discovery = true
source_count = 1
discovers_as = [
    "cursor-ide.state_vscdb",
]

[store.tables]
ItemTable = [
    "key",
    "value",
]
composerHeaders = [
    "composerId",
    "workspaceId",
    "createdAt",
    "lastUpdatedAt",
    "isArchived",
    "isSubagent",
    "recency",
    "checkpointAt",
    "value",
    "subagentTypeName",
]
cursorDiskKV = [
    "key",
    "value",
]

[[store]]
id = "cursor-ide.workspace_state"
path_pattern = "${HOME}/.config/Cursor/User/workspaceStorage/<hash>/state.vscdb"
role = "primary_chat"
format = "sqlite"
has_discovery = true
source_count = 73
discovers_as = [
    "cursor-ide.workspace_state",
]

[store.tables]
ItemTable = [
    "key",
    "value",
]
composerHeaders = [
    "composerId",
    "workspaceId",
    "createdAt",
    "lastUpdatedAt",
    "isArchived",
    "isSubagent",
    "recency",
    "checkpointAt",
    "value",
    "subagentTypeName",
]
cursorDiskKV = [
    "key",
    "value",
]

[[store]]
id = "cursor-ide.composer_headers"
path_pattern = "${HOME}/.config/Cursor/User/globalStorage/state.vscdb"
role = "app_state"
format = "sqlite"
has_discovery = false
source_count = 0

