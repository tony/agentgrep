[agent]
id = "grok"
app_version = "1.0.25"
version_source = "cli"

[observation]
observed_at = 2026-09-11
platform = "linux"
catalog_version = 39
generator = "scripts/observe_stores.py"

[[store]]
id = "grok.prompt_history"
path_pattern = "${GROK_HOME or ${HOME}/.grok}/sessions/<url_encoded_project>/prompt_history.jsonl"
role = "prompt_history"
format = "jsonl"
has_discovery = true
source_count = 9
discovers_as = [
    "grok.prompt_history",
]
records_sampled = 52

[store.record_keys]
"*" = [
    "is_bash",
    "prompt",
    "session_id",
    "timestamp",
]

[[store]]
id = "grok.sessions"
path_pattern = "${GROK_HOME or ${HOME}/.grok}/sessions/<url_encoded_project>/<session_uuid>/chat_history.jsonl"
role = "primary_chat"
format = "jsonl"
has_discovery = true
source_count = 30
discovers_as = [
    "grok.sessions",
]
discriminator = "type"
records_sampled = 2821

[store.record_keys]
assistant = [
    "content",
    "model_fingerprint",
    "model_id",
    "reasoning_effort",
    "tool_calls",
    "type",
]
backend_tool_call = [
    "kind",
    "type",
]
reasoning = [
    "encrypted_content",
    "id",
    "status",
    "summary",
    "type",
]
system = [
    "content",
    "type",
]
tool_result = [
    "content",
    "tool_call_id",
    "type",
]
user = [
    "content",
    "prior_turn_interrupt",
    "prompt_index",
    "synthetic_reason",
    "type",
]

