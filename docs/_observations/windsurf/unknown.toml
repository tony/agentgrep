manifest_version = 1
unclaimed = [
    { path_pattern = "${HOME}/.codeium/windsurf/code_tracker", kind = "dir" },
    { path_pattern = "${HOME}/.codeium/windsurf/codemaps", kind = "dir" },
    { path_pattern = "${HOME}/.codeium/windsurf/context_state", kind = "dir" },
    { path_pattern = "${HOME}/.codeium/windsurf/database", kind = "dir" },
    { path_pattern = "${HOME}/.codeium/windsurf/installation_id", kind = "file" },
    { path_pattern = "${HOME}/.codeium/windsurf/mcp_config.json", kind = "file" },
    { path_pattern = "${HOME}/.codeium/windsurf/onboarding.json", kind = "file" },
    { path_pattern = "${HOME}/.codeium/windsurf/recipes", kind = "dir" },
    { path_pattern = "${HOME}/.codeium/windsurf/skills", kind = "dir" },
    { path_pattern = "${HOME}/.codeium/windsurf/user_settings.pb", kind = "file" },
    { path_pattern = "${HOME}/.codeium/windsurf/ws-browser", kind = "dir" },
    { path_pattern = "${HOME}/.codeium/windsurf/ws-browser-extension", kind = "dir" },
    { path_pattern = "${HOME}/.codeium/windsurf/ws-browser-profile", kind = "dir" },
    { path_pattern = "${HOME}/.codeium/windsurf/windsurf/workflows", kind = "dir" },
]

[agent]
id = "windsurf"
app_version = "unknown"
version_source = "unknown"

[observation]
observed_at = 2026-10-25
platform = "linux"
catalog_version = 40
generator = "scripts/observe_stores.py"

[[store]]
id = "windsurf.cascade"
path_pattern = "${HOME}/.codeium/windsurf/cascade/<session_uuid>.pb"
role = "primary_chat"
format = "protobuf"
has_discovery = false
source_count = 0

[[store]]
id = "windsurf.implicit"
path_pattern = "${HOME}/.codeium/windsurf/implicit/<uuid>.pb"
role = "supplementary_chat"
format = "protobuf"
has_discovery = false
source_count = 0

[[store]]
id = "windsurf.chat_state"
path_pattern = "${HOME}/.codeium/windsurf/chat_state/<name>.pb"
role = "supplementary_chat"
format = "protobuf"
has_discovery = false
source_count = 0

[[store]]
id = "windsurf.memories"
path_pattern = "${HOME}/.codeium/windsurf/memories/<uuid>.pb"
role = "persistent_memory"
format = "protobuf"
has_discovery = false
source_count = 0

[[store]]
id = "windsurf.brain"
path_pattern = "${HOME}/.codeium/windsurf/brain/<uuid>/plan.md"
role = "plan"
format = "md_frontmatter"
has_discovery = false
source_count = 0

[[store]]
id = "windsurf.global_rules"
path_pattern = "${HOME}/.codeium/windsurf/memories/global_rules.md"
role = "instruction"
format = "text"
has_discovery = false
source_count = 0
