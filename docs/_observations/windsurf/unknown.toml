manifest_version = 1

[agent]
id = "windsurf"
app_version = "unknown"
version_source = "unknown"

[observation]
observed_at = 2026-08-08
platform = "linux"
catalog_version = 37
generator = "scripts/observe_stores.py"

[[store]]
id = "windsurf.cascade"
path_pattern = "${HOME}/.codeium/windsurf/cascade/<session_uuid>.pb"
